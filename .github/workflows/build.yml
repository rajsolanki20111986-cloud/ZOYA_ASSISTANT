name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap build android
      
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: android/app/release/*.apk